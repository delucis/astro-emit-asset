packages:
  - 'docs'
  - 'packages/*'

allowBuilds:
  esbuild: false # https://github.com/evanw/esbuild/issues/4085#issuecomment-2696009329
  sharp: false # https://sharp.pixelplumbing.com/install/

# Prevent installing packages published in the last 3 days.
minimumReleaseAge: 4320

# Use local versions of packages instead of installing from npm
preferWorkspacePackages: true
linkWorkspacePackages: true
